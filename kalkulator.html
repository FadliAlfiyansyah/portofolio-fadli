<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kalkulator Nilai</title>
</head>
<body>

  <h1>Kalkulator Nilai</h1>

  <form id="form">

    <div>
      <label for="tugas">Nilai Tugas:</label>
      <input type="number" id="tugas" name="tugas" min="0" max="100" required>
    </div>

    <div>
      <label for="uts">Nilai UTS:</label>
      <input type="number" id="uts" name="uts" min="0" max="100" required>
    </div>

    <div>
      <label for="uas">Nilai UAS:</label>
      <input type="number" id="uas" name="uas" min="0" max="100" required>
    </div>

    <button type="submit">Hitung</button>

  </form>

  <p id="result"></p>

  <script src="js/kalkulator.js" defer></script>

</body>
</html>
